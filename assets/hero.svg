<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">gh-control</title>
  <desc id="desc">gh-control banner: a menu bar showing the active GitHub account "alice-corp" with a dropdown to switch to the personal account "alice".</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1f2a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Noto Sans", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="260" fill="#58a6ff" opacity="0.06"/>
  <circle cx="1040" cy="620" r="200" fill="#3fb950" opacity="0.05"/>

  <!-- Left: title and tagline -->
  <text x="80" y="250" font-size="92" font-weight="800" fill="#f0f6fc">gh-control</text>
  <rect x="84" y="276" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="340" font-size="32" fill="#c9d1d9">Switch GitHub accounts</text>
  <text x="80" y="382" font-size="32" fill="#c9d1d9">from your top bar.</text>
  <text x="80" y="440" font-size="22" fill="#8b949e">Work and personal, one click apart.</text>
  <text x="80" y="472" font-size="22" fill="#8b949e">macOS menu bar · GNOME · KDE / XFCE tray</text>

  <g transform="translate(80 520)">
    <rect width="470" height="52" rx="10" fill="#010409" stroke="#30363d"/>
    <text x="22" y="34" font-size="20" class="mono" fill="#8b949e">$</text>
    <text x="46" y="34" font-size="20" class="mono" fill="#f0f6fc">gh-control switch alice</text>
  </g>

  <!-- Right: menu bar mock -->
  <g transform="translate(700 110)" filter="url(#shadow)">
    <rect width="500" height="40" rx="8" fill="#e8e8ed"/>
    <text x="20" y="27" font-size="17" fill="#1d1d1f">Fri 9:41</text>
    <rect x="238" y="6" width="150" height="28" rx="6" fill="#d1d1d6"/>
    <text x="252" y="27" font-size="17" font-weight="600" fill="#1f6feb">💼 alice-corp</text>
    <text x="410" y="27" font-size="17" fill="#1d1d1f">◐  ⌁  ≋</text>
  </g>

  <g transform="translate(860 158)" filter="url(#shadow)">
    <rect width="340" height="300" rx="12" fill="#f6f6f8" stroke="#d0d0d6"/>
    <text x="18" y="34" font-size="14" fill="#6e6e73">GitHub accounts on github.com</text>
    <rect x="8" y="48" width="324" height="36" rx="6" fill="#1f6feb"/>
    <text x="20" y="72" font-size="17" fill="#ffffff">✓  💼 Work — alice-corp</text>
    <text x="20" y="114" font-size="17" fill="#1d1d1f">     🏠 Personal — alice</text>
    <text x="20" y="152" font-size="17" fill="#1d1d1f">Toggle to next account</text>
    <line x1="14" y1="170" x2="326" y2="170" stroke="#d0d0d6"/>
    <text x="20" y="198" font-size="17" fill="#1d1d1f">Refresh</text>
    <text x="20" y="232" font-size="17" fill="#1d1d1f">Open github.com/alice-corp</text>
    <text x="20" y="266" font-size="17" fill="#1d1d1f">Open config</text>
    <text x="20" y="290" font-size="12" fill="#8e8e93">gh-control 0.1.0</text>
  </g>
</svg>
