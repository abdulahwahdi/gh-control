<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">gh-control menu on macOS and GNOME</title>
  <desc id="desc">Left: the macOS menu bar (SwiftBar or xbar) showing "alice-corp" with an open dropdown. Right: the same menu in the GNOME top bar through Argos. In both, the active account has a check mark and the other account can be clicked to switch.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Cantarell, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", sans-serif; font-size: 15px; }
      .caption { font-size: 14px; fill: #8b949e; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <rect width="960" height="420" rx="16" fill="#0d1117"/>

  <!-- macOS (SwiftBar / xbar) -->
  <g transform="translate(24 24)">
    <text class="caption" x="0" y="14">macOS · SwiftBar / xbar</text>
    <rect x="0" y="28" width="440" height="30" rx="6" fill="#ececf0"/>
    <circle cx="20" cy="43" r="6" fill="#1d1d1f"/>
    <text x="36" y="48" fill="#1d1d1f" font-weight="600">Finder</text>
    <rect x="200" y="32" width="122" height="22" rx="5" fill="#d1d1d6"/>
    <text x="210" y="48" fill="#1f6feb" font-weight="600">💼 alice-corp</text>
    <text x="340" y="48" fill="#1d1d1f">Mon 9:41</text>

    <g transform="translate(200 64)" filter="url(#shadow)">
      <rect width="240" height="290" rx="10" fill="#f6f6f8" stroke="#d0d0d6"/>
      <text class="small" x="14" y="26" fill="#6e6e73">GitHub accounts on github.com</text>
      <rect x="6" y="36" width="228" height="28" rx="5" fill="#1f6feb"/>
      <text x="14" y="55" fill="#ffffff">✓ 💼 Work — alice-corp</text>
      <text x="14" y="88" fill="#1d1d1f">    🏠 Personal — alice</text>
      <text x="14" y="118" fill="#1d1d1f">Toggle to next account</text>
      <line x1="10" y1="132" x2="230" y2="132" stroke="#d0d0d6"/>
      <text x="14" y="158" fill="#1d1d1f">Refresh</text>
      <text x="14" y="186" fill="#1d1d1f">Open github.com/alice-corp</text>
      <text x="14" y="214" fill="#1d1d1f">Open config</text>
      <text class="small" x="14" y="240" fill="#8e8e93">gh-control 0.1.0</text>
    </g>
  </g>

  <!-- GNOME (Argos) -->
  <g transform="translate(496 24)">
    <text class="caption" x="0" y="14">Linux · GNOME top bar (Argos)</text>
    <rect x="0" y="28" width="440" height="30" rx="0" fill="#000000"/>
    <text x="14" y="48" fill="#ffffff" font-weight="600">Activities</text>
    <text x="180" y="48" fill="#ffffff">Mon 09:41</text>
    <rect x="284" y="31" width="120" height="24" rx="12" fill="#3a3a3a"/>
    <text x="294" y="48" fill="#58a6ff" font-weight="600">💼 alice-corp</text>
    <text x="414" y="48" fill="#ffffff">⏻</text>

    <g transform="translate(168 64)" filter="url(#shadow)">
      <rect width="260" height="290" rx="14" fill="#2b2b2b" stroke="#3d3d3d"/>
      <text class="small" x="16" y="28" fill="#a0a0a0">GitHub accounts on github.com</text>
      <rect x="8" y="38" width="244" height="30" rx="8" fill="#3d3d3d"/>
      <text x="16" y="58" fill="#58a6ff">✓ 💼 Work — alice-corp</text>
      <text x="16" y="92" fill="#ffffff">    🏠 Personal — alice</text>
      <text x="16" y="122" fill="#ffffff">Toggle to next account</text>
      <line x1="12" y1="136" x2="248" y2="136" stroke="#4a4a4a"/>
      <text x="16" y="162" fill="#ffffff">Refresh</text>
      <text x="16" y="190" fill="#ffffff">Open github.com/alice-corp</text>
      <text x="16" y="218" fill="#ffffff">Open config</text>
      <text class="small" x="16" y="244" fill="#a0a0a0">gh-control 0.1.0</text>
    </g>
  </g>
</svg>
