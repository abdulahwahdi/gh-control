name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile bin/gh-control gh_control/*.py gh_control/plugins/swiftbar/*.py gh_control/plugins/tray/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python bin/gh-control --version
          python bin/gh-control --help
          # Without gh the menu must still render and exit 0.
          GH_CONTROL_GH=/nonexistent python bin/gh-control menu --format swiftbar | grep -q '⚠ gh'

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          sh -n install.sh
          bash -n gh_control/plugins/argos/gh-control.30s.sh
      - name: ShellCheck
        run: shellcheck install.sh gh_control/plugins/argos/gh-control.30s.sh
      - name: Installer dry run and source install in a temp HOME
        run: |
          export HOME="$(mktemp -d)"
          sh install.sh --dry-run --method source --frontend argos
          sh install.sh --method source --frontend argos
          test -L "$HOME/.local/bin/gh-control"
          test -L "$HOME/.config/argos/gh-control.30s.sh"
          "$HOME/.local/bin/gh-control" --version
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/gh-control"
          test ! -e "$HOME/.config/argos/gh-control.30s.sh"

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/gh-control --version
          /tmp/venv/bin/gh-control install --dry-run --frontend argos
          python -m zipfile -l dist/*.whl | grep -q 'gh_control/plugins/argos/gh-control.30s.sh'
